<div class="relative inline-block w-full">
  <button
    type="button"
    class="flex h-10 w-full items-center justify-between rounded-lg border border-gray-300 bg-transparent px-3 py-2 text-sm shadow-theme-xs focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:focus:border-brand-800
      {{
      value
        ? 'text-gray-800 dark:text-white/90'
        : 'text-gray-400 dark:text-gray-400'
    }} {{ className }}"
    (click)="toggleDropdown()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
  >
    <span class="truncate">{{ selectedLabel }}</span>
    <svg
      class="h-5 w-5 transition-transform duration-200"
      [class.rotate-180]="isOpen"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      aria-hidden="true"
    >
      <path
        fill-rule="evenodd"
        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
        clip-rule="evenodd"
      />
    </svg>
  </button>

  @if (isOpen) {
  <div
    class="absolute z-10 mt-1 w-full overflow-hidden rounded-lg border border-gray-200 bg-white shadow-lg focus:outline-none dark:border-gray-700 dark:bg-gray-800"
    role="listbox"
  >
    @for (option of options; track option.value) {
    <button
      type="button"
      class="block w-full px-4 py-2 text-start text-sm text-gray-700 hover:bg-gray-100 dark:text-white/90 dark:hover:bg-white/5"
      [class.bg-brand-50]="value === option.value"
      [class.text-brand-500]="value === option.value"
      [class.dark:bg-brand-500/10]="value === option.value"
      [class.dark:text-brand-400]="value === option.value"
      (click)="selectOption(option)"
      role="option"
      [attr.aria-selected]="value === option.value"
    >
      {{ option.label }}
    </button>
    }
  </div>
  }
</div>
