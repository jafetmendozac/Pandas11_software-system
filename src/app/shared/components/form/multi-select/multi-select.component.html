<div class="w-full" (keydown.escape)="onEscape($event)">
  @if (label) {
    <span class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">{{ label }}</span>
  }
  <div class="relative w-full">
    <button #trigger type="button"
      class="flex min-h-11 w-full items-center justify-between gap-3 rounded-lg border border-gray-300 bg-white px-3 py-2 text-start text-sm text-gray-800 shadow-theme-xs focus-visible:outline-2 focus-visible:outline-brand-500 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"
      [disabled]="disabled" [attr.aria-label]="label || placeholder" aria-haspopup="listbox" [attr.aria-expanded]="isOpen"
      (click)="toggleDropdown()">
      <span class="min-w-0 break-words">{{ selectedValuesText.length ? selectedValuesText.join(', ') : placeholder }}</span>
      <svg class="h-5 w-5 shrink-0 transition-transform" [class.rotate-180]="isOpen" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
    </button>
    @if (isOpen) {
      <div class="absolute z-20 mt-1 max-h-60 w-full overflow-y-auto rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800" role="listbox" [attr.aria-label]="label || placeholder" aria-multiselectable="true">
        @for (option of options; track option.value) {
          <button type="button" role="option" class="flex w-full items-center justify-between gap-2 px-4 py-2 text-start text-sm text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50 dark:text-white/90 dark:hover:bg-white/5"
            [disabled]="option.disabled || disabled" [attr.aria-selected]="selectedOptions.includes(option.value)" (click)="handleSelect(option.value)">
            <span>{{ option.text }}</span>@if (selectedOptions.includes(option.value)) {<span aria-hidden="true">✓</span>}
          </button>
        }
      </div>
    }
  </div>
</div>
