<app-page-breadcrumb pageTitle="Mascotas" />
<div class="space-y-6">
  <div>
    <app-component-card title="Listado de mascotas">
      <app-personalized-table
        title="Mascotas"
        [tableData]="tableData"
        [columns]="columns"
        (rowCreated)="createPet($event)"
        (rowUpdated)="updatePet($event)"
        (rowDeleted)="deletePet($event)"
      />
    </app-component-card>
  </div>
</div>
