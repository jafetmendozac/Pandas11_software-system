<app-page-breadcrumb pageTitle="Mascotas" />
<div class="space-y-6">
  <div>
    <app-component-card title="Listado de mascotas">
      <app-personalized-table
        title="Mascotas"
        [transactionData]="transactionData"
        (transactionCreated)="createPet($event)"
        (transactionUpdated)="updatePet($event)"
        (transactionDeleted)="deletePet($event)"
      />
    </app-component-card>
  </div>
</div>
