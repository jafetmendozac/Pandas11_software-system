<app-page-breadcrumb pageTitle="Mascotas" />
<div class="space-y-5">
  <button type="button" (click)="toggleArchive()" class="rounded-lg border border-gray-300 px-4 py-2 text-gray-700 dark:border-gray-700 dark:text-white">{{ archived ? 'Ver activos' : 'Consultar archivo' }}</button>
  @if(errorMessage){<p role="alert" class="text-error-600 dark:text-error-400">{{ errorMessage }}</p>}
  @if(loading){<p role="status" class="text-gray-600 dark:text-gray-300">Cargando…</p>}
  <app-component-card title="Mascotas del negocio">
    <app-personalized-table #petsTable [tableData]="tableData" [columns]="columns" [serverTotal]="total"
      (queryChanged)="loadPets($event)" [saveAction]="savePet"
      [allowCreate]="!archived && authorization.has('pets.manage')"
      [allowEdit]="!archived && authorization.has('pets.manage')"
      [allowDelete]="!archived && authorization.has('pets.manage')"
      addLabel="Añadir mascota" createTitle="Añadir mascota" editTitle="Editar mascota"
      searchPlaceholder="Buscar por mascota o cliente..." detailsLabel="Ver antecedentes" (rowDetails)="selectPet($event)" />
  </app-component-card>
  @if(selectedPet){<app-record-details [pet]="selectedPet" [archived]="archived" />}
</div>
