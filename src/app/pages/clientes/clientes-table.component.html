<app-page-breadcrumb [pageTitle]="selfService ? 'Mis datos y mascotas' : 'Clientes'" />
<div class="space-y-6">
  @if (!selfService && authorization.has('clients.read')) { <button type="button" (click)="toggleArchive()" class="rounded-lg border border-gray-300 px-4 py-2 text-gray-700 dark:border-gray-700 dark:text-white">{{ archived ? 'Ver activas' : 'Ver archivados' }}</button> }
  @if (loading) { <p role="status" class="text-gray-600 dark:text-gray-300">Cargando…</p> }
  @if (errorMessage) {
    <p class="rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400" role="alert">
      {{ errorMessage }}
    </p>
  }
  @if (selfService && !loading && total === 0 && !query.search) { <p class="text-gray-600 dark:text-gray-300">Aún no hay una ficha vinculada a tu cuenta. Solicita al personal que vincule tu registro.</p> }
  <app-component-card title="Listado de clientes">
    <app-personalized-table
      [title]="selfService ? 'Mis datos' : 'Clientes'"
      addLabel="Añadir cliente"
      createTitle="Añadir cliente"
      editTitle="Editar cliente"

      searchPlaceholder="Nombre, teléfono, WhatsApp o documento..."
      detailsLabel="Consultar ficha y mascotas"
      #clientsTable
      [serverTotal]="total" (queryChanged)="loadClients($event)"
      [saveAction]="saveClient"
      [allowCreate]="!selfService && !archived && authorization.has('clients.manage')"
      [allowEdit]="!selfService && !archived && authorization.has('clients.manage')"
      [allowDelete]="!selfService && !archived && authorization.has('clients.manage')"
      [tableData]="tableData"
      [columns]="columns"



      (rowDetails)="openPets($event)"
    />
  </app-component-card>
</div>
