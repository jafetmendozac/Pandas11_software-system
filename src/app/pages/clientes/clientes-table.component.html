<app-page-breadcrumb pageTitle="Clientes" />
<div class="space-y-6">
  @if (errorMessage) {
    <p class="rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400" role="alert">
      {{ errorMessage }}
    </p>
  }
  <app-component-card title="Listado de clientes">
    <app-personalized-table
      title="Clientes"
      addLabel="Añadir cliente"
      createTitle="Añadir cliente"
      editTitle="Editar cliente"
      searchKey="first_name"
      searchPlaceholder="Buscar por nombre..."
      detailsLabel="Ver mascotas"
      [tableData]="tableData"
      [columns]="columns"
      (rowCreated)="createClient($event)"
      (rowUpdated)="updateClient($event)"
      (rowDeleted)="deleteClient($event)"
      (rowDetails)="openPets($event)"
    />
  </app-component-card>
</div>

@if (selectedClient) {
  <div class="fixed inset-0 z-99999 flex justify-end" role="dialog" aria-modal="true">
    <button
      type="button"
      aria-label="Cerrar mascotas"
      class="absolute inset-0 cursor-default bg-gray-900/40 backdrop-blur-sm"
      (click)="closePets()"
    ></button>
    <aside class="relative z-10 flex h-full w-full flex-col overflow-hidden bg-white shadow-2xl dark:bg-gray-900 md:max-w-[720px]">
      <header class="flex items-start justify-between gap-4 border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
        <div>
          <p class="text-sm text-gray-500 dark:text-gray-400">Mascotas del cliente</p>
          <h2 class="mt-1 text-xl font-semibold text-gray-800 dark:text-white/90">{{ selectedClientName }}</h2>
        </div>
        <button
          type="button"
          aria-label="Cerrar panel"
          class="flex size-9 shrink-0 items-center justify-center rounded-full text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/10"
          (click)="closePets()"
        >
          <span aria-hidden="true" class="text-2xl leading-none">&times;</span>
        </button>
      </header>

      <div class="flex-1 overflow-y-auto p-4 sm:p-6">
        @if (petsErrorMessage) {
          <p class="mb-4 rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600" role="alert">
            {{ petsErrorMessage }}
          </p>
        }
        <app-personalized-table
          title="Mascotas"
          addLabel="Añadir mascota"
          createTitle="Añadir mascota"
          editTitle="Editar mascota"
          searchKey="name"
          searchPlaceholder="Buscar mascota..."
          [tableData]="selectedClientPets"
          [columns]="petColumns"
          (rowCreated)="createPet($event)"
          (rowUpdated)="updatePet($event)"
          (rowDeleted)="deletePet($event)"
        />
      </div>
    </aside>
  </div>
}
