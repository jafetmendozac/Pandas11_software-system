<app-page-breadcrumb pageTitle="Tarifas" />
<div class="space-y-6">
  @if (errorMessage()) {
    <p class="rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400" role="alert">
      {{ errorMessage() }}
    </p>
  }
  <app-component-card title="Tarifas por servicio">
    @if (loading()) {
      <p>Cargando servicios...</p>
    } @else if (errorMessage()) {
      <p class="text-red-500">{{ errorMessage() }}</p>
    } @else {
      <app-personalized-table
        title="Tarifas"
        addLabel="Añadir tarifa"
        createTitle="Añadir tarifa"
        editTitle="Editar tarifa"
        searchKey="service_name"
        searchPlaceholder="Buscar por servicio..."
        [tableData]="tableData()"
        [columns]="columns"
        (rowCreated)="createPrice($event)"
        (rowUpdated)="updatePrice($event)"
        (rowDeleted)="deletePrice($event)"
      />
    }
  </app-component-card>
</div>
