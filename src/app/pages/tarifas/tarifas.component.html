<app-page-breadcrumb pageTitle="Tarifas" />
<div class="space-y-5">
  @if(errorMessage()){<p role="alert" class="text-error-600 dark:text-error-400">{{ errorMessage() }}</p>}
  @if(loading()){<p role="status" class="text-gray-600 dark:text-gray-300">Cargando tarifas…</p>}
  <app-component-card title="Tarifas por servicio" desc="Prioridad: tamaño y pelaje, tamaño, pelaje, general y valores base. Cada tarifa define precio y duración completos.">
    <app-personalized-table #table [tableData]="tableData()" [columns]="columns" [serverTotal]="total()"
      (queryChanged)="loadTarifas($event)" [saveAction]="savePrice"
      [allowCreate]="authorization.has('service_prices.manage')" [allowEdit]="authorization.has('service_prices.manage')" [allowDelete]="authorization.has('service_prices.manage')"
      addLabel="Añadir tarifa" createTitle="Añadir tarifa" editTitle="Editar tarifa" searchPlaceholder="Buscar por servicio..." />
  </app-component-card>
  <app-service-simulator />
</div>
