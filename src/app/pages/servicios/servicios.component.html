<app-page-breadcrumb pageTitle="Servicios" />
<div class="space-y-5">
  @if(errorMessage()){<p role="alert" class="text-error-600 dark:text-error-400">{{ errorMessage() }}</p>}
  @if(loading()){<p role="status" class="text-gray-600 dark:text-gray-300">Cargando servicios…</p>}
  <app-component-card title="Servicios del negocio" desc="Desactivar conserva las tarifas. Puedes cambiar el estado de forma explícita al editar.">
    <app-personalized-table #table [tableData]="tableData()" [columns]="columns" [serverTotal]="total()"
      (queryChanged)="loadServices($event)" [saveAction]="saveService"
      [allowCreate]="authorization.has('services.manage')" [allowEdit]="authorization.has('services.manage')" [allowDelete]="authorization.has('services.manage')"
      addLabel="Añadir servicio" createTitle="Añadir servicio" editTitle="Editar servicio" searchPlaceholder="Buscar por nombre o descripción..." />
  </app-component-card>
</div>
