<app-page-breadcrumb pageTitle="Servicios" />
<div class="space-y-6">
  @if (errorMessage()) {
    <p class="rounded-lg border border-error-200 bg-error-50 px-4 py-3 text-sm text-error-600 dark:border-error-500/30 dark:bg-error-500/10 dark:text-error-400" role="alert">
      {{ errorMessage() }}
    </p>
  }
  <app-component-card title="Servicios del negocio">
    @if (loading()) {
      <p>Cargando servicios...</p>
    } @else if (errorMessage()) {
      <p class="text-red-500">{{ errorMessage() }}</p>
    } @else {
      <app-personalized-table
        addLabel="Añadir servicio"
        createTitle="Añadir servicio"
        editTitle="Editar servicio"
        searchKey="name"
        searchPlaceholder="Buscar por nombre..."
        [tableData]="tableData()"
        [columns]="columns"
        (rowCreated)="createService($event)"
        (rowUpdated)="updateService($event)"
        (rowDeleted)="deleteService($event)">
      </app-personalized-table>
    }
  </app-component-card>
</div>
