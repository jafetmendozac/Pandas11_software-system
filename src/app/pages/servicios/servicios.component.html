<app-page-breadcrumb pageTitle="Servicios" />
<div class="space-y-6">
  <app-component-card title="Servicios del negocio">
    <app-personalized-table
      title="Servicios"
      [transactionData]="transactionData"
      (transactionCreated)="createService($event)"
      (transactionUpdated)="updateService($event)"
      (transactionDeleted)="deleteService($event)"
    />
  </app-component-card>
</div>
