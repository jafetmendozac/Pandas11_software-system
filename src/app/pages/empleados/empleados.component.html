<app-page-breadcrumb pageTitle="Empleados y disponibilidad" />
<div class="space-y-6">
  @if(errorMessage()){<p role="alert" class="text-error-600 dark:text-error-400">{{ errorMessage() }}</p>}
  @if(loading()){<p role="status" class="text-gray-600 dark:text-gray-300">Cargando empleados…</p>}
  <app-component-card title="Empleados del negocio" desc="Selecciona Horarios y disponibilidad para consultar un empleado. Puedes desactivarlo al editar su estado; se conserva su historial.">
    <app-personalized-table #table [tableData]="tableData()" [columns]="columns" [serverTotal]="total()"
      (queryChanged)="loadEmployees($event)" [saveAction]="saveEmployee"
      [allowCreate]="authorization.has('employees.manage') && profilesReady()" [allowEdit]="authorization.has('employees.manage')" [allowDelete]="false"
      addLabel="Añadir empleado" createTitle="Añadir empleado" editTitle="Editar empleado"
      searchPlaceholder="Buscar por nombre o teléfono…" detailsLabel="Horarios y disponibilidad" (rowDetails)="selectEmployee($event)" />
  </app-component-card>
  @for(person of [selected()]; track person?.id){
    <app-work-calendar [employee]="person" />
  }
</div>
