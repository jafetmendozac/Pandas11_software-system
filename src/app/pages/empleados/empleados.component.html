<app-page-breadcrumb pageTitle="Empleados" />
<div class="space-y-6">
  <app-component-card title="Gestión de empleados">
    <p class="mb-4 text-sm text-gray-500 dark:text-gray-400">
      Puedes registrar personal desde aquí. Si posteriormente habilitas login, guarda su UUID de
      <code>auth.users</code> en el perfil.
    </p>
    <app-personalized-table
      title="Empleados"
      [tableData]="tableData"
      [columns]="columns"
      (rowCreated)="createProfile($event)"
      (rowUpdated)="updateProfile($event)"
      (rowDeleted)="deleteProfile($event)"
    />
  </app-component-card>
</div>
